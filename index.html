<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Botton AI</title>
</head>
<body>
  <h1>Botton AI 🤖</h1>

  <div style="max-width:600px; margin:20px auto; font-family:Arial;">
    <input id="message" type="text" placeholder="Type a message" style="width:70%; padding:12px;" />
    <button id="send" style="padding:12px 18px;">Send</button>

    <div id="status" style="margin-top:12px; color:#555;"></div>
    <div id="reply" style="margin-top:12px; white-space:pre-wrap;"></div>
  </div>

  <script>
    const workerUrl = "PASTE_YOUR_WORKER_URL_HERE";

    document.getElementById("send").addEventListener("click", async () => {
      const text = document.getElementById("message").value.trim();
      if (!text) return;

      document.getElementById("status").textContent = "Thinking...";
      document.getElementById("reply").textContent = "";

      try {
        const res = await fetch(workerUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });

        const data = await res.json();
        document.getElementById("reply").textContent = data.answer || "No answer returned.";
      } catch (err) {
        document.getElementById("reply").textContent = "Error: " + err.message;
      } finally {
        document.getElementById("status").textContent = "";
      }
    });
  </script>
</body>
</html>
